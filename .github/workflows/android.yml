name: Android APK

# Builds the WebView wrapper and leaves the APKs as artifacts. Nothing here builds the web client
# itself - the app fetches that over HTTP at runtime.

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      startUrl:
        description: 'Page the app opens'
        required: false
        default: 'https://play.fluxious-rsps.com'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Preinstalled on the runners, but not depended on staying there.
      - name: Ensure ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi

      - name: Generate launcher icons
        run: bash android/tools/make-icons.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        # Debug is signed with the standard debug key and installs as-is; release is unsigned.
        # chmod because the wrapper is committed from Windows, which has no executable bit to keep.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -Pflux.startUrl="${{ github.event.inputs.startUrl || 'https://play.fluxious-rsps.com' }}" \
            assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxious-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxious-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
