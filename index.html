<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- The client owns the viewport: no zooming, no bouncing, and it draws under the notch. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="robots" content="noindex" />

        <link rel="icon" href="/favicon.ico" sizes="any" />

        <!-- Installed to a home screen the client launches with no browser chrome at all. On iOS
             that is the only way to it: WebKit allows fullscreen for video and nothing else, so the
             Fullscreen API the page requests on Android does nothing there. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#0E1719" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Fluxious" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />

        <title>Fluxious - Play</title>

        <!-- The client is seven megabytes and the last thing boot needs, so its download starts
             here, before the page's own script has been fetched. The stamp matches the one the boot
             script puts on the URL, so the script tag it adds later is served from this. -->
        <link rel="preload" as="script" href="/client/web-client.js?v=%VITE_CLIENT_BUILD%" />

        <script type="module" src="/resources/js/app.ts"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
